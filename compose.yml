services:
  qmk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qmk-firmware
    volumes:
      # ビルド済みファームウェアの出力先
      - ./firmware:/firmware
      - ./qmk_firmware:/qmk_firmware
      # キーボードのリポジトリをマウント
      - ./aki27/cocot46plus:/qmk_firmware/keyboards/aki27/cocot46plus
    stdin_open: true
    tty: true
    # command: /bin/bash -c "./setup.sh; tail -f /dev/null"
    environment:
      - QMK_HOME=/qmk_firmware

